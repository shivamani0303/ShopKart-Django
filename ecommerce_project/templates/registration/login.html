{% extends "base.html" %}
{% block title %}Login | ShopKart{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="auth-card mx-auto">
        <h2 class="fw-bold mb-4">Welcome back</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {{ field.errors }}
                </div>
            {% endfor %}
            <button class="btn btn-primary w-100">Login</button>
        </form>
        <p class="text-center mt-3 mb-0">New here? <a href="{% url 'shop:register' %}">Create an account</a></p>
    </div>
</div>
{% endblock %}
