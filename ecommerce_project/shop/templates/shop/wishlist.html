{% extends "base.html" %}
{% block title %}Wishlist | ShopKart{% endblock %}
{% block content %}
<div class="container py-5">
    <h2 class="fw-bold mb-4">My Wishlist</h2>
    <div class="row g-4">
        {% for item in items %}
        <div class="col-sm-6 col-lg-3">
            {% include "shop/product_card.html" with product=item.product %}
        </div>
        {% empty %}
        <div class="col-12"><div class="alert alert-info">Your wishlist is empty.</div></div>
        {% endfor %}
    </div>
</div>
{% endblock %}
